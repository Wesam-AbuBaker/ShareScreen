<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>شاشة المعلم</title></head>
<body style="background:#000; color:white; text-align:center; padding-top:40vh; font-family:sans-serif;">
<p>جارٍ الاتصال بشاشة المعلم...</p>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbygZnWDUhRQatPkWnxVMxVImlEuvQdWvK0FXlhx3G37Yn8VjZwSD9NIJ5XXq3u4bakW/exec";
  const params = new URLSearchParams(location.search);
  const lab = params.get('lab');
  if (lab) {
    // إعادة توجيه كاملة (وليس fetch) لتجنب CORS
    window.location.href = `${GAS_URL}?lab=${encodeURIComponent(lab)}`;
  } else {
    document.body.innerHTML = "معامل المختبر مفقود.";
  }
</script>
</body>
</html>
